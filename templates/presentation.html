<!doctype html>
<html lang="$if(lang)$$lang$$else$ja$endif$">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
$if(description)$
    <meta name="description" content="$description$" />
$endif$
    <title>$if(title)$$title$$else$Presentation$endif$</title>
    <script>
      if (new URLSearchParams(window.location.search).has("present")) {
        document.documentElement.classList.add("present");
      }

      window.addEventListener("DOMContentLoaded", () => {
        const slides = Array.from(document.querySelectorAll("main > section, main > .screen, main > .flow"));
        if (!slides.length) return;

        slides.forEach((slide, index) => {
          slide.dataset.slideNumber = (index + 1) + " / " + slides.length;
        });

        const editableSelector = "input, textarea, select, button, [contenteditable='true']";
        const isEditableTarget = (target) =>
          target instanceof Element && Boolean(target.closest(editableSelector));

        const slideLefts = () =>
          slides.map((slide) => slide.getBoundingClientRect().left + window.scrollX);

        const scrollToSlide = (direction) => {
          const lefts = slideLefts();
          const currentX = window.scrollX;
          const threshold = 24;
          let targetIndex = -1;

          if (direction > 0) {
            targetIndex = lefts.findIndex((left) => left > currentX + threshold);
            if (targetIndex === -1) targetIndex = lefts.length - 1;
          } else {
            for (let index = lefts.length - 1; index >= 0; index -= 1) {
              if (lefts[index] < currentX - threshold) {
                targetIndex = index;
                break;
              }
            }
            if (targetIndex === -1) targetIndex = 0;
          }

          window.scrollTo({ left: lefts[targetIndex], top: window.scrollY, behavior: "smooth" });
        };

        window.addEventListener("keydown", (event) => {
          if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
          if (isEditableTarget(event.target)) return;
          if (!["ArrowRight", "ArrowLeft"].includes(event.key)) return;
          if (event.repeat) return;

          event.preventDefault();
          const forward = event.key === "ArrowRight";
          scrollToSlide(forward ? 1 : -1);
        });
      });
    </script>
    <link rel="stylesheet" href="assets/presentation.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M0,0 L10,4 L0,8 Z" fill="#1d4ed8"></path>
        </marker>
        <marker id="arrowhead-warn" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M0,0 L10,4 L0,8 Z" fill="#9a3412"></path>
        </marker>
      </defs>
    </svg>
    <main class="talk">
$body$
    </main>
  </body>
</html>
