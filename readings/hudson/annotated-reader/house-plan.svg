<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" role="img" aria-labelledby="plan-title plan-desc">
<title id="plan-title">A Crystal Age の家：読書のための推定間取り図</title>
<desc id="plan-desc">部屋の形と左右の位置は仮定。入口の向かいに広間の絵窓がある。広間から通路で音楽室へ、音楽室から長い彫像回廊へ、回廊の奥から階段とガラス戸を通って高い床の母の部屋へ。就寝室は背面テラスに沿って並ぶが、主要室との接続は不明。母の寝室は、母の特別な地位と看病の動線から専用の居住区画の一部として推定配置。一般就寝室の列との位置関係は未確定。図の上が北ではない。</desc>
